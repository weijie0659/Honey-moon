<style>
/* Layout: a single-column travel companion — live "now" card first, bottom tab bar like an app.
   Palette: stone paper + ink, wine (harvest season, romance) for "now", rail teal for transport. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --ink:#1D232C; --muted:#5D6572; --line:#DCDFE3;
  --wine:#8A2C4B; --wine-soft:#F4E6EB; --rail:#2C6A6E; --rail-soft:#E3EFEF;
  --good:#2F7D4F; --warn:#9A5F0E; --warn-soft:#FBF0DD; --on-accent:#FFFFFF;
  --font-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121419; --surface:#1B1F27; --ink:#E7E9ED; --muted:#9AA2AE; --line:#2B303A;
  --wine:#E07A9C; --wine-soft:#3A2230; --rail:#6CC0C3; --rail-soft:#1D3436;
  --good:#6FCF97; --warn:#E3A94B; --warn-soft:#3A2E18; --on-accent:#16181E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1B1F27; --ink:#E7E9ED; --muted:#9AA2AE; --line:#2B303A;
  --wine:#E07A9C; --wine-soft:#3A2230; --rail:#6CC0C3; --rail-soft:#1D3436;
  --good:#6FCF97; --warn:#E3A94B; --warn-soft:#3A2E18; --on-accent:#16181E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.app{max-width:720px;margin:0 auto}
a{color:var(--rail)}
h1,h2,h3{text-wrap:balance}
.top{padding-block:18px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.brand h1{font-family:var(--font-display);font-size:1.55rem;margin:0;letter-spacing:.03em;line-height:1.25}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.clocks{display:flex;gap:8px}
.clock{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.clock .lbl{font-size:.68rem;color:var(--muted);letter-spacing:.08em}
.clock .t{font-family:var(--font-mono);font-size:1.02rem;font-variant-numeric:tabular-nums;line-height:1.3}
.simbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);
  border-radius:10px;padding:8px 12px;font-size:.85rem;margin-block:6px}
section{margin-block:18px}
h2{font-family:var(--font-display);font-size:1.15rem;margin:0 0 10px;letter-spacing:.02em}
h3{font-size:1rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.74rem;letter-spacing:.1em;color:var(--muted)}
.now-title{font-family:var(--font-display);font-size:1.5rem;line-height:1.35;margin:4px 0 2px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--rail-soft);color:var(--rail);font-weight:500;letter-spacing:.03em;white-space:nowrap}
.chip.wine{background:var(--wine-soft);color:var(--wine)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;
  font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--on-accent)}
.btn.small{padding:5px 10px;font-size:.8rem}
.btn.danger{color:var(--wine);border-color:var(--wine)}
.btn:disabled{opacity:.5;cursor:default}
:is(a,button,input,select,summary):focus-visible{outline:2px solid var(--rail);outline-offset:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.next{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--wine);margin-right:6px;vertical-align:middle;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline li.current{background:var(--wine-soft);border-radius:10px;padding-inline:8px;margin-inline:-8px;border-top-color:transparent}
.timeline li.current + li{border-top-color:transparent}
.timeline li.done .it-title{color:var(--muted)}
.time{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem;padding-top:1px}
.it-title{font-weight:600;line-height:1.45}
.it-note{color:var(--muted);font-size:.84rem;margin-top:2px}
.it-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;font-size:.8rem}
.day{margin-block:22px;scroll-margin-top:12px}
.day-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.day-head .d{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums}
.day-head .c{font-family:var(--font-display);font-size:1.1rem;font-weight:700}
.day.today .card{border-color:var(--wine)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row > *{min-width:0}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.big-num{font-family:var(--font-mono);font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.2}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--wine)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:440px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.span2{grid-column:1 / -1}
.exp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding-block:10px;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp .amt{text-align:right}
details summary{cursor:pointer;font-weight:600}
.notice{font-size:.84rem;border-radius:10px;padding:10px 12px;background:var(--rail-soft);color:var(--ink)}
.notice.warn{background:var(--warn-soft)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs a{flex:1;max-width:130px;text-align:center;padding:9px 2px 10px;color:var(--muted);text-decoration:none;font-size:.74rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs a[aria-current="page"]{color:var(--wine);font-weight:700}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.leg{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding-block:12px;border-top:1px solid var(--line)}
.leg:first-child{border-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85rem;z-index:9}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

function partsIn(tz,d){const o={};new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(p=>o[p.type]=p.value);
  return {y:+o.year,mo:+o.month,d:+o.day,h:+o.hour%24,m:+o.minute,s:+o.second,date:`${o.year}-${o.month}-${o.day}`}}
function zonedToUtc(date,time,tz){const [y,mo,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);const g=Date.UTC(y,mo-1,d,h,mi);const p=partsIn(tz,new Date(g));return g-(Date.UTC(p.y,p.mo-1,p.d,p.h,p.m)-g)}

function haversine(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

  $('#sim-go').onclick=()=>{const v=$('#sim-input').value;if(v)setSim(v)};
  const sc=$('#sim-clear');if(sc)sc.onclick=()=>setSim(null);
  document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>setSim(b.dataset.sim));
}

/* ============ 畫面：行程 ============ */
function renderPlan(){const st=status();const today=st.phase==='trip'?st.day:-1;
  let h=`<section><h2>行程中的節慶</h2><div class="card"><div class="list">${EVENTS.map(e=>`<div class="row"><div><div style="font-weight:600">${esc(e.name)}</div><div class="small muted">${esc(e.where)}</div></div><div class="small num" style="text-align:right;white-space:nowrap">${esc(e.when)}</div></div>`).join('')}</div>
   <p class="small muted" style="margin:10px 0 0">日期依2026年推估，出發前一個月再確認。</p></div></section>`;
  if(today>=0)h+=`<div class="btnrow"><a class="btn small" href="#plan" id="go-today">跳到今天</a></div>`;
  h+=DAYS.map((d,di)=>{const s=d.stay&&stayById(d.stay);return `<div class="day ${di===today?'today':''}" id="d-${d.date}">
   <div class="day-head"><span class="d">${fmtDate(d.date)}</span><span class="c">${esc(d.city)}</span><span class="chip plain">${COUNTRY[d.c].name}</span>${di===today?'<span class="chip wine">今天</span>':''}</div>
   <div class="card">${timelineHTML(di,st)}${s?`<div class="small muted" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px">住宿：${esc(s.city)} · ${esc(s.area)}</div>`:''}</div></div>`}).join('');
  $('#view').innerHTML=h;
  const g=$('#go-today');if(g)g.onclick=e=>{e.preventDefault();document.getElementById('d-'+DAYS[today].date).scrollIntoView({behavior:'smooth'})};
}

/* ============ 畫面：住宿 ============ */
function nights(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5)}
function renderStay(){const total=STAYS.reduce((n,s)=>n+nights(s.in,s.out),0);
  let h=`<section><h2>住宿（共 ${total} 晚）</h2><p class="small muted" style="margin:-4px 0 10px">都還沒訂。訂好之後把飯店名稱和地址告訴 Claude，就會更新到這裡。</p><div class="list">`;
  h+=STAYS.map(s=>{const bk=`https://www.booking.com/searchresults.html?ss=${encodeURIComponent(s.q)}&checkin=${s.in}&checkout=${s.out}&group_adults=2&no_rooms=1`;
   return `<div class="card"><div class="row"><div><div class="eyebrow">${fmtDate(s.in)} → ${fmtDate(s.out)} · ${nights(s.in,s.out)} 晚</div><h3 style="margin-top:2px">${esc(s.city)}</h3></div><span class="chip warn">待訂</span></div>
    <p style="margin:6px 0 0">建議區域：${esc(s.area)}</p>${s.tip?`<p class="small muted" style="margin:2px 0 0">${esc(s.tip)}</p>`:''}
    <div class="btnrow" style="margin-top:10px"><a class="btn small" target="_blank" rel="noopener" href="${bk}">在 Booking.com 查這幾晚</a></div></div>`}).join('');
  $('#view').innerHTML=h+'</div></section>'}

/* ============ 畫面：交通 ============ */
function renderMove(){
  let h=`<section><h2>主要移動</h2><div class="card">${LEGS.map(l=>`<div class="leg"><div><div class="num" style="font-weight:600">${fmtDate(l.date).replace(/（.）/,'')}</div><span class="chip ${l.mode==='flight'?'wine':''}">${MODE[l.mode]}</span></div>
   <div><div style="font-weight:600">${esc(l.from)} → ${esc(l.to)}</div><div class="small">${esc(l.dur)} · ${esc(l.info)}</div>
   ${l.book?`<div class="small muted">預訂：${esc(l.book)}</div>`:''}${l.status==='done'?'<div class="chips" style="margin-top:4px"><span class="chip">已訂</span></div>':''}
   ${l.url?`<div class="it-links"><a target="_blank" rel="noopener" href="${l.url}">${esc(new URL(l.url).hostname.replace('www.',''))}</a></div>`:''}</div></div>`).join('')}</div></section>
   <section><h2>瑞士旅行通行證</h2><div class="card"><p style="margin:0">9/30～10/5 剛好6天，買6日通行證。瑞士境內火車、遊船和大部分登山交通可搭或打折；薩爾斯堡到瑞士邊境、TGV 往巴黎不含在內。</p>
   <div class="it-links" style="margin-top:8px"><a target="_blank" rel="noopener" href="https://www.sbb.ch">sbb.ch</a><a target="_blank" rel="noopener" href="https://www.jungfrau.ch">jungfrau.ch</a></div></div></section>
   <section><h2>自駕提醒</h2><div class="card"><ul style="margin:0;padding-left:1.2em">
   <li>台灣駕照正本＋國際駕照</li><li>租車指定自排，告知要開進捷克</li><li>捷克走高速公路要先上網買電子通行證</li>
   <li>捷克酒駕零容忍，一滴都不能喝；全天要開大燈</li><li>布拉格市區不要開車，直接在機場還車</li></ul></div></section>`;
  $('#view').innerHTML=h}

/* ============ 花費 ============ */
const CATS=['交通','住宿','餐飲','門票','購物','其他'];
const CURS=['EUR','CZK','CHF','TWD'];
let settings=Object.assign({url:'',key:'',names:['先生','太太'],rates:{EUR:37,CZK:1.5,CHF:40,TWD:1}},store.get('settings',{}));
let exps=store.get('exps',[]);let syncState={busy:false,last:null,err:''};
const saveExps=()=>store.set('exps',exps);
const twd=e=>(+e.amount||0)*(+settings.rates[e.currency]||0);
const money=n=>'NT$ '+Math.round(n).toLocaleString('en-US');
async function api(payload){
  if(!settings.url)throw new Error('尚未設定同步網址');
  if(!payload){const r=await fetch(settings.url+(settings.url.includes('?')?'&':'?')+'action=list&key='+encodeURIComponent(settings.key));return r.json()}
  const r=await fetch(settings.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:settings.key},payload))});return r.json()}
async function sync(quiet){
  if(!settings.url||syncState.busy)return;syncState.busy=true;syncState.err='';if(!quiet&&location.hash==='#money')renderMoney();
  try{
    for(const e of exps.filter(x=>x.pending==='add')){const r=await api({action:'add',item:strip(e)});if(r.error)throw new Error(r.error);e.pending=null}
    for(const e of exps.filter(x=>x.pending==='del')){const r=await api({action:'delete',id:e.id});if(r.error)throw new Error(r.error);e.gone=true}
    const r=await api();if(r.error)throw new Error(r.error);
    const local=exps.filter(x=>x.pending);exps=(r.items||[]).filter(x=>!local.some(l=>l.id===x.id)).concat(local.filter(x=>!x.gone));
    saveExps();syncState.last=Date.now();
  }catch(err){syncState.err=String(err.message||err)}
  syncState.busy=false;if(location.hash==='#money')renderMoney()}
const strip=e=>({id:e.id,date:e.date,amount:e.amount,currency:e.currency,category:e.category,payer:e.payer,note:e.note,created:e.created});
function todayTrip(){const st=status();const d=st.phase==='trip'?DAYS[st.day]:null;return d}
function renderMoney(){
  const active=exps.filter(e=>e.pending!=='del');const total=active.reduce((n,e)=>n+twd(e),0);
  const by=(k)=>{const m={};active.forEach(e=>{const key=k(e);m[key]=(m[key]||0)+twd(e)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const d=todayTrip();const pTime=partsIn(d?d.tz:TW,new Date(now()));
  const defDate=d?d.date:pTime.date;const defCur=d?COUNTRY[d.c].cur:'TWD';
  const groups={};active.forEach(e=>(groups[e.date]=groups[e.date]||[]).push(e));
  const dates=Object.keys(groups).sort().reverse();
  const bars=(rows)=>rows.length?rows.map(([k,v])=>`<div><div class="row small"><span>${esc(k)}</span><span class="num">${money(v)}</span></div><div class="bar"><i style="width:${total?Math.max(2,v/total*100):0}%"></i></div></div>`).join(''):'<p class="small muted" style="margin:0">還沒有紀錄</p>';
  const countryOf=e=>{const day=DAYS.find(x=>x.date===e.date);return day?COUNTRY[day.c].name:'出發前／其他'};
  let syncLine;
  if(!settings.url)syncLine=`<div class="notice warn">還沒連上 Google 試算表：花費目前只存在這支手機。設定好同步後，你和太太的紀錄會合在一起。</div>`;
  else syncLine=`<div class="row small"><span class="muted">${syncState.busy?'同步中…':syncState.err?'同步失敗：'+esc(syncState.err):syncState.last?'已同步 '+new Date(syncState.last).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}):'已設定同步'}${exps.some(x=>x.pending)?' · 有 '+exps.filter(x=>x.pending).length+' 筆等待上傳':''}</span><button class="btn small" id="btn-sync" ${syncState.busy?'disabled':''}>立即同步</button></div>`;
  let h=`<section><div class="card"><div class="eyebrow">總花費（換算台幣）</div><div class="big-num" style="margin-top:2px">${money(total)}</div>
   <div class="small muted">${active.length} 筆 · 匯率 EUR ${settings.rates.EUR} · CZK ${settings.rates.CZK} · CHF ${settings.rates.CHF}</div>
   <div style="margin-top:12px">${syncLine}</div></div></section>
  <section><h2>新增一筆</h2><form class="card" id="exp-form"><div class="grid3">
   <label class="span2" style="grid-column:span 2">金額<input id="f-amount" inputmode="decimal" type="number" step="0.01" min="0" required placeholder="例如 24.5"></label>
   <label>幣別<select id="f-cur">${CURS.map(c=>`<option ${c===defCur?'selected':''}>${c}</option>`).join('')}</select></label>
   <label>類別<select id="f-cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
   <label>誰付的<select id="f-payer">${settings.names.map(n=>`<option>${esc(n)}</option>`).join('')}<option>一起</option></select></label>
   <label>日期<input type="date" id="f-date" value="${defDate}"></label>
   <label class="span2">備註<input id="f-note" placeholder="例如 布拉格城堡門票" maxlength="80"></label></div>
   <div class="btnrow" style="margin-top:12px"><button class="btn primary" type="submit">記一筆</button><span class="small muted" id="f-preview" style="align-self:center"></span></div></form></section>
  <section><h2>分類</h2><div class="card stack">${bars(by(e=>e.category))}</div></section>
  <section><div class="grid2"><div class="card stack"><h3>誰付的</h3>${bars(by(e=>e.payer))}</div><div class="card stack"><h3>各國</h3>${bars(by(countryOf))}</div></div></section>
  <section><h2>明細</h2>${dates.length?dates.map(dt=>{const sum=groups[dt].reduce((n,e)=>n+twd(e),0);return `<div class="card" style="margin-bottom:10px"><div class="row"><b>${fmtDate(dt)}</b><span class="num small">${money(sum)}</span></div>
    ${groups[dt].sort((a,b)=>b.created-a.created).map(e=>`<div class="exp"><div><div style="font-weight:600">${esc(e.note||e.category)}</div><div class="small muted">${esc(e.category)} · ${esc(e.payer)}${e.pending==='add'?' · 待上傳':''}</div></div>
     <div class="amt"><div class="num">${(+e.amount).toLocaleString('en-US',{maximumFractionDigits:2})} ${esc(e.currency)}</div><div class="small muted num">${money(twd(e))}</div>
     <button class="btn small" style="margin-top:4px" data-del="${esc(e.id)}">刪除</button></div></div>`).join('')}</div>`}).join(''):'<div class="card"><p class="muted" style="margin:0">還沒有花費紀錄。用上面的表單記第一筆，例如機場快線車票。</p></div>'}</section>
  <section><details class="card" id="settings"><summary>設定：同步、名字、匯率</summary><div class="stack" style="margin-top:12px">
   <label>Google 試算表同步網址（Apps Script 網址）<input id="s-url" value="${esc(settings.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
   <label>通關密語（和 Apps Script 裡設定的一樣）<input id="s-key" value="${esc(settings.key)}"></label>
   <div class="grid2"><label>付款人 1<input id="s-n0" value="${esc(settings.names[0])}"></label><label>付款人 2<input id="s-n1" value="${esc(settings.names[1])}"></label></div>
   <div class="grid3">${['EUR','CZK','CHF'].map(c=>`<label>1 ${c} = 台幣<input id="s-r-${c}" type="number" step="0.01" value="${settings.rates[c]}"></label>`).join('')}</div>
   <div class="btnrow"><button class="btn primary" id="s-save">儲存設定</button><button class="btn" id="s-csv">複製全部明細（CSV）</button></div>
   <p class="small muted" style="margin:0">匯率是換算用的參考值，改了會重新計算所有台幣金額。</p></div></details></section>`;
  const open=$('#settings')&&$('#settings').open;
  $('#view').innerHTML=h;if(open)$('#settings').open=true;
  const prev=()=>{const a=+$('#f-amount').value,c=$('#f-cur').value;$('#f-preview').textContent=a?'約 '+money(a*(settings.rates[c]||0)):''};
  $('#f-amount').oninput=prev;$('#f-cur').onchange=prev;
  $('#exp-form').onsubmit=ev=>{ev.preventDefault();const a=+$('#f-amount').value;if(!a){toast('請輸入金額');return}
    const e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:$('#f-date').value||defDate,amount:a,currency:$('#f-cur').value,category:$('#f-cat').value,payer:$('#f-payer').value,note:$('#f-note').value.trim(),created:Date.now(),pending:'add'};
    exps.push(e);saveExps();toast('已記下 '+money(twd(e)));renderMoney();sync(true)};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='確定刪除？';b.classList.add('danger');setTimeout(()=>{if(b.isConnected){b.dataset.armed='';b.textContent='刪除';b.classList.remove('danger')}},3000);return}
    const e=exps.find(x=>x.id===b.dataset.del);if(!e)return;
    if(e.pending==='add')exps=exps.filter(x=>x!==e);else e.pending='del';
    saveExps();renderMoney();sync(true)});
  const bs=$('#btn-sync');if(bs)bs.onclick=()=>sync();
  $('#s-save').onclick=()=>{settings.url=$('#s-url').value.trim();settings.key=$('#s-key').value.trim();settings.names=[$('#s-n0').value.trim()||'先生',$('#s-n1').value.trim()||'太太'];
    ['EUR','CZK','CHF'].forEach(c=>{const v=+$('#s-r-'+c).value;if(v>0)settings.rates[c]=v});store.set('settings',settings);toast('設定已儲存');renderMoney();sync()};
  $('#s-csv').onclick=()=>{const rows=[['日期','金額','幣別','台幣','類別','付款人','備註']].concat(active.map(e=>[e.date,e.amount,e.currency,Math.round(twd(e)),e.category,e.payer,e.note]));
    const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    navigator.clipboard.writeText(csv).then(()=>toast('已複製，可貼到試算表'),()=>toast('無法複製，請改用 Google 試算表查看'))};
}

/* ============ 路由 ============ */
const VIEWS={now:renderNow,plan:renderPlan,stay:renderStay,move:renderMove,money:renderMoney};
function render(){const k=(location.hash||'#now').slice(1);const v=VIEWS[k]?k:'now';
  document.querySelectorAll('.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===v?'page':'false'));VIEWS[v]()}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
renderSimbar();tick();render();sync(true);
setInterval(tick,1000);
setInterval(()=>{const k=(location.hash||'#now').slice(1);if(k==='now'||k===''){if(!document.activeElement||document.activeElement===document.body)renderNow()}},30000);
setInterval(()=>{if(location.hash==='#money'&&document.visibilityState==='visible')sync(true)},60000);
</script>

</body>
</html>
